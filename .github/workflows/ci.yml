name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install nexus-sdk (with dev + crypto extras)
        run: pip install -e ".[dev]"

      - name: Run tests
        # The Ruflo integration test is opt-in (NEXUS_RUFLO_INTEGRATION=1)
        # and stays skipped here — it needs a live ruflo/npx install this
        # runner doesn't have, by design (see nexus/adapters/ruflo.py).
        run: pytest -v
