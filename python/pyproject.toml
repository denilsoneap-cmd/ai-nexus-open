[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-sdk"
version = "0.1.0"
description = "Reference Python implementation of the Nexus Protocol, aligned to A2A (RFC-0003)."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=42"]
a2a = ["a2a-sdk[http-server]>=1.1.2", "uvicorn>=0.52"]
dev = ["pytest>=7", "cryptography>=42", "a2a-sdk[http-server]>=1.1.2", "uvicorn>=0.52"]

[tool.setuptools.packages.find]
where = ["src"]
